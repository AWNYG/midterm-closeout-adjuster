# 四川电力市场滚动撮合收盘微调算法 — 参数配置
# 结算/考核
deviation_band_low: 0.85      # 考核带下界
deviation_band_high: 1.15     # 考核带上界
recover_factor: 1.1           # 差价收益回收倍数

# 交易
theta_yuan_mwh: 2.0           # 不交易带半宽（费用+风险溢价），无回测先保守默认
max_amount_yuan_mwh: null     # 单时段金额上限（可选，默认不启用）
execution_mode: "limit_order" # 挂单为主，不追价，未成交放弃该时段
initial_order_policy: "mid"   # 初始挂单价：mid=区间中间价（可扩展）

# 注：min_lot_mwh（最小交易单位）与 position_limit_mwh（单时段持仓上限）
# 由输入 JSON 提供（每日/每市场动态值），本配置文件不再重复定义，以输入为准。

# 风险
confidence: 0.8               # 整体置信度（预测系统未逐时段提供前的全局值）
confidence_shrink: true       # 低置信度是否收缩带边界/缩量
sigma_load_mwh: null          # 负荷预测误差σ，null=关闭收缩
sigma_spot_yuan_mwh: null
shrink_bands: 0.0             # 带边界向中心收缩的比例（σ不可用时的保守参数）
confidence_min: 0.5           # 低于此置信度直接 hold

# 校验
price_min_yuan_mwh: 0
price_max_yuan_mwh: 481.44     # 平均成交价/合同成交价上限 = 四川燃煤发电基准价 401.2 元/MWh × 上浮 20%
                               # 依据：四川省发改委转发国家发改委《关于进一步深化燃煤发电上网电价市场化改革的通知》（发改价格〔2021〕1439号，2021-10-15 起执行）
spot_price_min_yuan_mwh: -50   # 现货价预测下限（现货价格不受中长期 20% 浮动限制，可负，单独校验）
spot_price_max_yuan_mwh: 800   # 现货价预测上限
